[package]
name = "stein-client"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false
description = "Stein Client: the launcher for original Minecraft 1.8.9 with the Stein Loader."

[[bin]]
name = "SteinClient"
path = "src/main.rs"

# Extra fields of the executable's version info (Properties > Details), read by tauri-winres under tauri-build; the
# product name, description, version, company and copyright come from tauri.conf.json.
[package.metadata.tauri-winres]
OriginalFilename = "SteinClient.exe"
InternalName = "SteinClient"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tauri.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
stein-core = { path = "../core" }
open = "5"
